  @freva-org/browser-python/ui/code-figure.html - the markup contract of the code figures.

  The one place the shape `@freva-org/browser-python/ui/code` and `/ui/copy` read is written down
  as markup: a page's configuration element, and one runnable, editable figure. Every generator of
  these figures - portal-builder's pages, Waterpark's MkDocs hook - is tested against this file,
  and this package's own test mounts it, so a change to the shape fails on both sides at once.

  Inside <code> a generator may put any highlighting markup (spans); the text content must be the
  source exactly. Attributes and classes named here are the contract; others are free.
  `data-portal-editable` is the generator's choice (an editable figure), so it is optional; so is a
  `<span class="portal-code-title">` before the language, for a named block.
-->
