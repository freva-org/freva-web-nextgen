<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The callback URL carries code/state: keep them out of any Referer header. -->
    <meta name="referrer" content="no-referrer" />
    <title>Databrowser + Keycloak</title>
    <script type="importmap">
      {
        "imports": {
          "@freva-org/databrowser": "/pkg/databrowser/index.js",
          "@freva-org/freva-client-terminal": "/pkg/freva-client-terminal/index.js",
          "@freva-org/data-inspector": "/pkg/data-inspector/index.mjs",
          "@freva-org/ts-oidc-auth-client": "/pkg/ts-oidc-auth-client/index.js"
        }
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font:
          14px system-ui,
          sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 8px 16px;
        border-bottom: 1px solid #ddd;
      }
      header .who {
        margin-left: auto;
        color: #555;
      }
      #app {
        flex: 1;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Databrowser + Keycloak</strong>
      <span class="who" id="who">checking session…</span>
      <button id="login" type="button" hidden>Sign in</button>
      <button id="logout" type="button" hidden>Sign out</button>
    </header>
    <div id="app"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
