<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>freva-client-terminal · shell-line wrapping fixture</title>
    <!--
      WHY THIS FILE EXISTS

      jsdom performs no layout, so a width mock cannot answer the only question that matters here:
      when the immutable prefix itself wraps onto two, three or four visual lines, does the editable
      command still start immediately after the last prefix token, and does every continuation line
      begin at the container's left edge?

      The old geometry answered "no". It painted the prefix in an absolutely-positioned,
      `white-space: nowrap` layer and pushed the command past it with a `text-indent`, plus a
      62%-of-width threshold that dropped the whole prefix onto its own line. An indent only shifts
      the FIRST line, so as soon as the prefix wrapped, the two layers disagreed: the typed text
      either overlapped the painted prompt or was exiled to the following line.

      This fixture measures the REAL thing in a REAL engine, using the package's actual rules, and
      reports PASS/FAIL per case. `src/wrap.ts` states the same contract as a pure function that the
      node test suite asserts; this page is what confirms the CSS realises it.

      HOW TO RUN
        npx serve packages/freva-client-terminal   # or any static server, or just open the file
        open fixtures/wrapping.html
      Results render below and are also on `window.__fixtureResult` for an automated harness.
    -->
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 24px;
        background: #0b0f16;
        color: #d8e2f2;
      }
      h1 {
        font-size: 16px;
      }
      .case {
        margin: 18px 0;
        border: 1px solid #2c4267;
        border-radius: 8px;
        padding: 10px;
      }
      .case h2 {
        font-size: 12px;
        margin: 0 0 8px;
        color: #7b8aa6;
        font-weight: 600;
      }

      /* ---- the geometry under test: copied from the package stylesheet ---- */
      .te-flow {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        word-break: normal;
        font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 12.5px;
        line-height: 1.65;
        padding: 2px 0;
      }
      .cli-prefix {
        position: static;
        display: inline;
        white-space: inherit;
        padding: 0;
        pointer-events: none;
        user-select: none;
      }
      .te-cmd {
        display: inline;
        outline: none;
        white-space: inherit;
        min-width: 1px;
        caret-color: #28c840;
      }
      .prompt {
        color: #28c840;
        font-weight: 700;
      }
      .fixed {
        color: #6f7f9c;
      }
      .k {
        color: #8fb6ff;
      }
      .eq {
        color: #6f7f9c;
      }
      .v {
        color: #f0b86b;
      }

      .verdict {
        margin-top: 6px;
        font-family: ui-monospace, monospace;
        font-size: 11px;
      }
      .pass {
        color: #34c98a;
      }
      .fail {
        color: #f0795f;
      }
      #summary {
        font-size: 14px;
        font-weight: 700;
        padding: 8px 0;
      }
    </style>
  </head>
  <body>
    <h1>Shell-line wrapping - the prefix and the command share one inline flow</h1>
    <div id="cases"></div>
    <div id="summary">running…</div>

    <script>
      // Each case narrows the container until the prefix occupies N visual lines, then checks:
      //  1. the command's first character is on the prefix's LAST line (when it fits there);
      //  2. it starts immediately after the last prefix token, with no indent;
      //  3. every continuation line begins at the container's left content edge.
      const PREFIX = [
        { text: "$", cls: "prompt" },
        { text: " " },
        { text: "freva-client databrowser data-search", cls: "fixed" },
        { text: " " },
        { text: "--flavour", cls: "fixed" },
        { text: " " },
        { text: "cmip6", cls: "fixed" },
      ];
      const COMMAND = [
        { text: "project", cls: "k" },
        { text: "=", cls: "eq" },
        { text: "cmip6", cls: "v" },
        { text: " " },
        { text: "variable", cls: "k" },
        { text: "=", cls: "eq" },
        { text: "tas", cls: "v" },
      ];

      function build(width) {
        const wrap = document.createElement("div");
        wrap.style.width = width + "px";
        const flow = document.createElement("div");
        flow.className = "te-flow";
        const prefix = document.createElement("span");
        prefix.className = "cli-prefix";
        for (const s of PREFIX) {
          const n = s.cls ? document.createElement("span") : document.createTextNode(s.text);
          if (s.cls) {
            n.className = s.cls;
            n.textContent = s.text;
          }
          prefix.append(n);
        }
        prefix.append(document.createTextNode(" "));
        const cmd = document.createElement("span");
        cmd.className = "te-cmd";
        cmd.setAttribute("contenteditable", "plaintext-only");
        for (const s of COMMAND) {
          const n = s.cls ? document.createElement("span") : document.createTextNode(s.text);
          if (s.cls) {
            n.className = s.cls;
            n.textContent = s.text;
          }
          cmd.append(n);
        }
        flow.append(prefix, cmd);
        wrap.append(flow);
        return { wrap, flow, prefix, cmd };
      }

      /** Distinct line boxes (by rounded top) of an element's own content. */
      function lineTops(el) {
        const tops = new Set();
        for (const r of el.getClientRects()) tops.add(Math.round(r.top));
        return [...tops].sort((a, b) => a - b);
      }

      function measure(width) {
        const { wrap, flow, prefix, cmd } = build(width);
        document.body.append(wrap);
        const flowLeft = flow.getBoundingClientRect().left;
        const prefixTops = lineTops(prefix);
        // getClientRects() returns one rect per inline FRAGMENT, not per line box, so group them
        // into visual lines by their top and take the leftmost fragment of each.
        const cmdRects = [...cmd.getClientRects()];
        const byLine = new Map();
        for (const r of cmdRects) {
          const key = Math.round(r.top);
          const cur = byLine.get(key);
          if (!cur || r.left < cur.left) byLine.set(key, { left: r.left, top: r.top });
        }
        const cmdLines = [...byLine.entries()].sort((a, b) => a[0] - b[0]).map((e) => e[1]);
        const first = cmdLines[0];
        const result = {
          width,
          prefixLines: prefixTops.length,
          commandOnPrefixLastLine:
            !!first && Math.round(first.top) === prefixTops[prefixTops.length - 1],
          // No indent: a continuation must start at the flow's content edge (allow 1px rounding).
          commandLines: cmdLines.length,
          continuationsAtLeftEdge: cmdLines.slice(1).every((r) => Math.abs(r.left - flowLeft) <= 1),
          // The command must not be pushed right by an indent on its first line either: it starts
          // after the prefix's last token, which is somewhere PAST the left edge but on the same line.
          commandStartsAfterPrefix: !!first && first.left > flowLeft,
        };
        wrap.remove();
        return result;
      }

      const cases = [];
      // Sweep widths and keep the first width that yields each prefix line count 1..4.
      const wanted = new Map();
      for (let w = 700; w >= 90; w -= 2) {
        const m = measure(w);
        if (m.prefixLines >= 1 && m.prefixLines <= 4 && !wanted.has(m.prefixLines)) {
          wanted.set(m.prefixLines, m);
        }
      }
      for (const lines of [1, 2, 3, 4]) {
        const m = wanted.get(lines);
        const el = document.createElement("div");
        el.className = "case";
        if (!m) {
          el.innerHTML = `<h2>${lines}-line prefix</h2><div class="verdict fail">FAIL - no width produced a ${lines}-line prefix</div>`;
          cases.push({ lines, ok: false, detail: "unreachable" });
        } else {
          const { wrap } = build(m.width);
          el.innerHTML = `<h2>${lines}-line prefix &middot; container ${m.width}px</h2>`;
          el.append(wrap);
          const ok =
            m.commandOnPrefixLastLine && m.continuationsAtLeftEdge && m.commandStartsAfterPrefix;
          const v = document.createElement("div");
          v.className = "verdict " + (ok ? "pass" : "fail");
          v.textContent =
            (ok ? "PASS" : "FAIL") +
            ` - command on prefix's last line: ${m.commandOnPrefixLastLine};` +
            ` continuations at left edge: ${m.continuationsAtLeftEdge};` +
            ` starts after the prefix (not at an indent): ${m.commandStartsAfterPrefix}`;
          el.append(v);
          cases.push({ lines, ok, ...m });
        }
        document.getElementById("cases").append(el);
      }

      const passed = cases.filter((c) => c.ok).length;
      window.__fixtureResult = { passed, total: cases.length, cases };
      const s = document.getElementById("summary");
      s.textContent = `${passed}/${cases.length} cases pass`;
      s.className = passed === cases.length ? "pass" : "fail";
    </script>
  </body>
</html>
