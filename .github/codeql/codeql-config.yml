name: freva-web-nextgen CodeQL

paths-ignore:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "packages/stac-browser/.upstream/**"
  # Test code and examples never ship; findings there are noise.
  - "**/tests/**"
  - "**/browser-tests/**"
  - "**/*.test.ts"
  - "examples/**"

queries:
  - uses: security-extended
