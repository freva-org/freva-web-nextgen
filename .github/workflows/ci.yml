name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: checks (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # the portal builder type-checks against the other workspaces'
      # compiled declarations.
      - name: Build
        run: npm run build

      - name: Type-check
        run: npm run typecheck

      # Every workspace but the portal builder
      - name: Workspaces to test here
        id: ws
        run: |
          echo "flags=$(npm query .workspace | jq -r '.[].name | select(. != "@freva-org/portal-builder") | "-w \(.)"' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Test
        run: npm test ${{ steps.ws.outputs.flags }} --if-present

      - name: Coverage
        run: npm run test:coverage ${{ steps.ws.outputs.flags }} --if-present

  # A hand-bumped version would be released by the next push to main without ever
  # going through the version PR. Skipped for the changesets bot's own branch.
  changeset-required:
    name: changeset
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: A version bump must come with a changeset
        run: |
          base="origin/${{ github.base_ref }}"
          bumped=$(git diff "$base"...HEAD -- 'packages/*/package.json' \
                   | grep -E '^\+  "version":' || true)
          [ -n "$bumped" ] || { echo "No package version changed."; exit 0; }

          added=$(git diff --name-only --diff-filter=A "$base"...HEAD -- '.changeset/*.md' \
                  | grep -v 'README.md' || true)
          if [ -n "$added" ]; then
            echo "Version change accompanied by a changeset:"; echo "$added"; exit 0
          fi

          echo "::error::This PR changes a package version but adds no changeset."
          echo "Versions are bumped by \`changeset version\` in the release PR, not by hand."
          echo "Run \`npx changeset\` and commit the generated file instead."
          exit 1

  # Auth gates that need no browser. Out of the matrix: the mutation gate rewrites
  # src/ in place, so two runs must not share a checkout.
  auth-gates:
    name: auth (bytes & mutations)
    runs-on: ubuntu-latest

    env:
      PKG: "@freva-org/ts-oidc-auth-client"

    # Run from the repo root and target the package with `-w`: a job-level
    # working-directory makes the install step's own directory ambiguous.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: packages/ts-oidc-auth-client/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Fail fast if the install produced no usable runner, rather than 53
      # identical unexplained mutation failures.
      - name: Check the toolchain the gates depend on
        run: npm exec -w $PKG -- vitest --version

      - name: Control-byte gate
        run: npm run check:bytes -w $PKG

      - name: Mutation gate
        run: npm run check:mutations -w $PKG

  # Real-browser gates. One matrix rather than near-identical jobs; adding a
  # package is one list entry. `fail-fast: false` - a WebKit failure in the auth
  # client says nothing about databrowser layout.
  browser-gates:
    name: playwright (${{ matrix.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth
            dir: ts-oidc-auth-client
            pkg: "@freva-org/ts-oidc-auth-client"
            engines: chromium firefox webkit
          - name: databrowser
            dir: databrowser
            pkg: "@freva-org/databrowser"
            engines: chromium
          - name: dataset-tree
            dir: dataset-tree
            pkg: "@freva-org/dataset-tree"
            engines: chromium

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: packages/${{ matrix.dir }}/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Build every workspace: the databrowser fixtures load a workspace
      # dependency's dist, and `npm run build -w` does not build dependencies.
      - name: Build
        run: npm run build

      - name: Install Playwright engines
        run: npm exec -w ${{ matrix.pkg }} -- playwright install --with-deps ${{ matrix.engines }}

      # Strict: a browser that will not launch is a failure, never a skip.
      - name: Browser gate
        run: npm run test:browser:strict -w ${{ matrix.pkg }}

  browser-python:
    name: browser-python (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            script: test:browser:chromium
          - engine: firefox
            script: test:browser:firefox:ci
          - engine: webkit
            script: test:browser:webkit

    env:
      PKG: "@freva-org/browser-python"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: packages/browser-python/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -w $PKG

      - name: Runtime manifest id
        id: runtime
        run: |
          echo "id=$(node packages/browser-python/scripts/runtime-manifest.mjs)" >> "$GITHUB_OUTPUT"

      - name: Cache the Pyodide distribution
        uses: actions/cache@v4
        with:
          path: packages/browser-python/.runtime
          key: pyodide-${{ steps.runtime.outputs.id }}

      - name: Assemble the runtime
        run: node packages/browser-python/scripts/prepare-runtime.mjs

      # A suite whose wheels are missing exits 3 and is reported as NOT RUN, which
      # reads like a pass in a summary.
      - name: The runtime is complete
        run: node packages/browser-python/scripts/check-runtime.mjs

      - name: Cache the prepared add-ons
        uses: actions/cache@v4
        with:
          path: packages/browser-python/.addons
          key: addons-${{ hashFiles('packages/browser-python/bin/freva-addons.json') }}

      - name: Prepare the add-ons
        run: node packages/browser-python/bin/freva-browser-python.mjs prepare-addons --out packages/browser-python/.addons

      - name: Install Playwright ${{ matrix.engine }}
        run: npm exec -w $PKG -- playwright install --with-deps ${{ matrix.engine }}

      # Strict: a browser that will not launch is a failure, never a skip.
      - name: Browser suites in ${{ matrix.engine }}
        run: npm run ${{ matrix.script }} -w $PKG

  # What a consumer installs, and what it weighs. No browser and no runtime.
  browser-python-package:
    name: browser-python (package)
    runs-on: ubuntu-latest

    env:
      PKG: "@freva-org/browser-python"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: packages/browser-python/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -w $PKG

      # Packs, installs elsewhere and imports from there; then the size budget, the
      # console layer's weight (no jQuery in the ROOT bundle) and the README figures.
      - name: Package and size
        run: npm run check:package -w $PKG

  portal-builder:
    name: portal-builder
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: packages/portal-builder/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned RST helper
        run: pip install ./tools/portal-rst-renderer

      # Diagrams render at build time. A missing browser is a failure here.
      - name: Install the pinned browser
        run: npm exec -w @freva-org/portal-builder -- playwright install --with-deps chromium

      - name: Runtime manifest id
        id: runtime
        run: |
          echo "id=$(node packages/browser-python/scripts/runtime-manifest.mjs)" >> "$GITHUB_OUTPUT"

      - name: Cache the Pyodide distribution
        uses: actions/cache@v4
        with:
          path: packages/browser-python/.runtime
          key: pyodide-${{ steps.runtime.outputs.id }}

      - name: Assemble the runtime
        run: node packages/browser-python/scripts/prepare-runtime.mjs

      - name: Freva wheel id
        id: freva
        run: |
          echo "id=$(node packages/browser-python/scripts/freva-wheelhouse-key.mjs)" >> "$GITHUB_OUTPUT"

      - name: Cache the derived Freva wheel
        uses: actions/cache@v4
        with:
          path: packages/browser-python/.freva-wheels
          key: freva-wheel-${{ steps.freva.outputs.id }}

      - name: Build workspace dependencies
        run: npm run build

      # The example portal enables the STAC Browser component, so the suites that build it need
      # the prepared materials. Preparing them compiles a third-party application and its ~800
      # dependencies, so the result is cached on the recipe's own key.
      - name: STAC materials id
        id: stac
        run: |
          echo "id=$(npm run --silent stac:cache-key)" >> "$GITHUB_OUTPUT"

      - name: Cache the prepared STAC materials
        uses: actions/cache@v4
        with:
          path: packages/stac-browser/materials
          key: stac-materials-${{ steps.stac.outputs.id }}

      - name: Prepare the STAC materials
        run: npm run stac:prepare

      - name: Test
        run: npm test -w @freva-org/portal-builder

      - name: Coverage
        run: npm run test:coverage -w @freva-org/portal-builder

      - name: Browser gate
        run: npm run test:browser:strict -w @freva-org/portal-builder

      - name: Python playground gate
        run: npm run test:browser:python -w @freva-org/portal-builder

      - name: Packaging gate
        run: npm run test:packaging -w @freva-org/portal-builder

      - name: Freva playground under its generated policy (needs a public package index)
        run: npm run test:browser:package-index -w @freva-org/portal-builder

      - name: Build the fictional consumers
        run: |
          node packages/portal-builder/bin/freva-portal-builder.mjs build \
            --source-root examples/minimal-portal \
            --config examples/minimal-portal/portal.yaml \
            --out build/minimal --quiet
          node packages/portal-builder/bin/freva-portal-builder.mjs verify --dir build/minimal
          node packages/portal-builder/bin/freva-portal-builder.mjs build \
            --source-root examples/full-portal \
            --config examples/full-portal/portal.yaml \
            --out build/full --quiet \
            --effective-at 2026-01-07T12:00:00Z \
            --stac-materials packages/stac-browser/materials
          node packages/portal-builder/bin/freva-portal-builder.mjs verify --dir build/full
        env:
          SOURCE_DATE_EPOCH: 1760000000

      - name: Source closure
        run: npm run closure

      - name: Licence report and SBOM
        run: |
          npm run licenses
          npm run sbom

      - uses: actions/upload-artifact@v4
        with:
          name: portal-builder-supply-chain
          path: packages/portal-builder/reports/
