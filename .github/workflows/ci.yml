name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI only reads the repository; caches and artifact uploads need no token scopes.
# Without this block every job inherits the repository default, which may be write-all.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: checks (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 22.23.4 is the declared minimum (packages/portal-builder engines.node, set by Astro 7.4):
        # test that exact version, not whatever "22" resolves to today.
        node-version: ["22.23.4", 24]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # the portal builder type-checks against the other workspaces'
      # compiled declarations.
      - name: Build
        run: npm run build

      - name: Type-check
        run: npm run typecheck

      # Every workspace but the portal builder
      - name: Workspaces to test here
        id: ws
        run: |
          echo "flags=$(npm query .workspace | jq -r '.[].name | select(. != "@freva-org/portal-builder") | "-w \(.)"' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Test
        run: npm test ${{ steps.ws.outputs.flags }} --if-present

      - name: Coverage
        run: npm run test:coverage ${{ steps.ws.outputs.flags }} --if-present

  # A hand-bumped version would be released by the next push to main without ever
  # going through the version PR. Skipped for the changesets bot's own branch.
  changeset-required:
    name: changeset
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: A version bump must come with a changeset
        # Through the environment, not `${{ }}` in the script: a branch name is attacker-chosen
        # text, and an expression is pasted into the shell before it runs.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="origin/${BASE_REF}"
          bumped=$(git diff "$base"...HEAD -- 'packages/*/package.json' \
                   | grep -E '^\+  "version":' || true)
          [ -n "$bumped" ] || { echo "No package version changed."; exit 0; }

          added=$(git diff --name-only --diff-filter=A "$base"...HEAD -- '.changeset/*.md' \
                  | grep -v 'README.md' || true)
          if [ -n "$added" ]; then
            echo "Version change accompanied by a changeset:"; echo "$added"; exit 0
          fi

          echo "::error::This PR changes a package version but adds no changeset."
          echo "Versions are bumped by \`changeset version\` in the release PR, not by hand."
          echo "Run \`npx changeset\` and commit the generated file instead."
          exit 1

  # Auth gates that need no browser. Out of the matrix: the mutation gate rewrites
  # src/ in place, so two runs must not share a checkout.
  auth-gates:
    name: auth (bytes & mutations)
    runs-on: ubuntu-latest

    env:
      PKG: "@freva-org/ts-oidc-auth-client"

    # Run from the repo root and target the package with `-w`: a job-level
    # working-directory makes the install step's own directory ambiguous.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: packages/ts-oidc-auth-client/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Fail fast if the install produced no usable runner, rather than 53
      # identical unexplained mutation failures.
      - name: Check the toolchain the gates depend on
        run: npm exec -w $PKG -- vitest --version

      - name: Control-byte gate
        run: npm run check:bytes -w $PKG

      - name: Mutation gate
        run: npm run check:mutations -w $PKG

  # Real-browser gates. One matrix rather than near-identical jobs; adding a
  # package is one list entry. `fail-fast: false` - a WebKit failure in the auth
  # client says nothing about databrowser layout.
  browser-gates:
    name: playwright (${{ matrix.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth
            dir: ts-oidc-auth-client
            pkg: "@freva-org/ts-oidc-auth-client"
            engines: chromium firefox webkit
          - name: databrowser
            dir: databrowser
            pkg: "@freva-org/databrowser"
            engines: chromium
          - name: dataset-tree
            dir: dataset-tree
            pkg: "@freva-org/dataset-tree"
            engines: chromium

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: packages/${{ matrix.dir }}/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Build every workspace: the databrowser fixtures load a workspace
      # dependency's dist, and `npm run build -w` does not build dependencies.
      - name: Build
        run: npm run build

      - name: Install Playwright engines
        run: npm exec -w ${{ matrix.pkg }} -- playwright install --with-deps ${{ matrix.engines }}

      # Strict: a browser that will not launch is a failure, never a skip.
      - name: Browser gate
        run: npm run test:browser:strict -w ${{ matrix.pkg }}

  browser-python:
    name: browser-python (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            script: test:browser:chromium
          - engine: firefox
            script: test:browser:firefox:ci
          - engine: webkit
            script: test:browser:webkit

    env:
      PKG: "@freva-org/browser-python"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: packages/browser-python/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -w @freva-org/freva-client-terminal -w $PKG

      - name: Runtime manifest id
        id: runtime
        run: |
          echo "id=$(node packages/browser-python/scripts/runtime-manifest.mjs)" >> "$GITHUB_OUTPUT"

      - name: Cache the Pyodide distribution
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: packages/browser-python/.runtime
          key: pyodide-${{ steps.runtime.outputs.id }}

      - name: Assemble the runtime
        run: node packages/browser-python/scripts/prepare-runtime.mjs

      # A suite whose wheels are missing exits 3 and is reported as NOT RUN, which
      # reads like a pass in a summary.
      - name: The runtime is complete
        run: node packages/browser-python/scripts/check-runtime.mjs

      - name: Cache the prepared add-ons
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: packages/browser-python/.addons
          key: addons-${{ hashFiles('packages/browser-python/bin/freva-addons.json') }}

      - name: Prepare the add-ons
        run: node packages/browser-python/bin/freva-browser-python.mjs prepare-addons --out packages/browser-python/.addons

      - name: Install Playwright ${{ matrix.engine }}
        run: npm exec -w $PKG -- playwright install --with-deps ${{ matrix.engine }}

      # Strict: a browser that will not launch is a failure, never a skip.
      - name: Browser suites in ${{ matrix.engine }}
        run: npm run ${{ matrix.script }} -w $PKG

      # The notebook kernel on the same engine, runtime and add-ons. Its site is a pinned,
      # hash-checked JupyterLite build, which needs a Python to run in.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build the notebook kernel and its prebuilt extension
        run: |
          npm run build -w @freva-org/jupyterlite-freva-kernel
          npm run build:labextension -w @freva-org/jupyterlite-freva-kernel

      - name: Notebook suites in ${{ matrix.engine }}
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
        run: npm run test:browser -w @freva-org/jupyterlite-freva-kernel

      # ClimateClaw and the data panel in the trimmed Lab interface, against the mock Freva, on the
      # same engine and runtime. The site is planned by portal-builder and installs jupyterlite-ai
      # from PyPI, pinned with hashes.
      - name: Build the assistant, the data panel and portal-builder
        run: |
          npm run build
          npm run build:labextension -w @freva-org/jupyterlite-climateclaw
          npm run build:labextension -w @freva-org/jupyterlite-freva-data

      - name: Assistant and data panel suite in ${{ matrix.engine }}
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
        run: npm run test:browser -w @freva-org/jupyterlite-climateclaw

  # The two extensions installed from their wheels into real JupyterLab: 4.5.0 with jupyterlite-ai
  # 0.20.1 (its minimum), and 4.4.0 with the data panel alone.
  jupyterlab-smoke:
    name: JupyterLab smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: packages/browser-python/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build the extensions
        run: |
          npm run build
          npm run build:labextension -w @freva-org/jupyterlite-climateclaw
          npm run build:labextension -w @freva-org/jupyterlite-freva-data

      - name: Install Playwright chromium
        run: npm exec -w @freva-org/browser-python -- playwright install --with-deps chromium

      - name: JupyterLab smoke test
        env:
          BROWSER_STRICT: "1"
        run: npm run test:jupyterlab -w @freva-org/jupyterlite-climateclaw

  # What a consumer installs, and what it weighs. No browser and no runtime.
  browser-python-package:
    name: browser-python (package)
    runs-on: ubuntu-latest

    env:
      PKG: "@freva-org/browser-python"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: packages/browser-python/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -w @freva-org/freva-client-terminal -w $PKG

      # Packs, installs elsewhere and imports from there; then the size budget, the
      # console layer's weight (no jQuery in the ROOT bundle) and the README figures.
      - name: Package and size
        run: npm run check:package -w $PKG

  portal-builder:
    name: portal-builder
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: packages/portal-builder/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install the pinned RST helper
        run: pip install ./tools/portal-rst-renderer

      # Diagrams render at build time. A missing browser is a failure here.
      - name: Install the pinned browser
        run: npm exec -w @freva-org/portal-builder -- playwright install --with-deps chromium

      - name: Runtime manifest id
        id: runtime
        run: |
          echo "id=$(node packages/browser-python/scripts/runtime-manifest.mjs)" >> "$GITHUB_OUTPUT"

      - name: Cache the Pyodide distribution
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: packages/browser-python/.runtime
          key: pyodide-${{ steps.runtime.outputs.id }}

      - name: Assemble the runtime
        run: node packages/browser-python/scripts/prepare-runtime.mjs

      - name: Freva wheel id
        id: freva
        run: |
          echo "id=$(node packages/browser-python/scripts/freva-wheelhouse-key.mjs)" >> "$GITHUB_OUTPUT"

      - name: Cache the derived Freva wheel
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: packages/browser-python/.freva-wheels
          key: freva-wheel-${{ steps.freva.outputs.id }}

      - name: Build workspace dependencies
        run: npm run build

      # The notebook tests plan and check sites from the kernel's, the assistant's and the data
      # panel's prebuilt extensions, and the sessions gate below runs `prepare-notebook`.
      - name: Build the notebook extensions
        run: npm run build:labextensions

      # The example portal enables the STAC Browser component, so the suites that build it need
      # the prepared materials. Preparing them compiles a third-party application and its ~800
      # dependencies, so the result is cached on the recipe's own key.
      - name: STAC materials id
        id: stac
        run: |
          echo "id=$(npm run --silent stac:cache-key)" >> "$GITHUB_OUTPUT"

      - name: Cache the prepared STAC materials
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: packages/stac-browser/materials
          key: stac-materials-${{ steps.stac.outputs.id }}

      - name: Prepare the STAC materials
        run: npm run stac:prepare

      - name: Test
        run: npm test -w @freva-org/portal-builder

      - name: Coverage
        run: npm run test:coverage -w @freva-org/portal-builder

      - name: Browser gate
        run: npm run test:browser:strict -w @freva-org/portal-builder

      - name: Python playground gate
        run: npm run test:browser:python -w @freva-org/portal-builder

      # Session choices, telemetry, sleep and the notebook, with a real interpreter.
      - name: Python sessions and notebook gate
        run: npm run test:browser:sessions -w @freva-org/portal-builder

      # The same-origin notebook at / and under a base path, on one preview.
      - name: Same-origin notebook gate
        run: npm run test:browser:same-origin -w @freva-org/portal-builder

      - name: Runnable snippet controls and editing gate
        run: npm run test:browser:snippets -w @freva-org/portal-builder

      - name: Dataset-tree search index gate (live block, no gateway requests)
        run: npm run test:browser:tree:index -w @freva-org/portal-builder

      - name: Cosmos landing ending gate (theme.backdrop.tail)
        run: npm run test:browser:cosmos-tail -w @freva-org/portal-builder

      - name: Footer bar shortcuts gate (chrome.footer.bar)
        run: npm run test:browser:footer-bar -w @freva-org/portal-builder

      - name: Responsive navigation and maths overflow gate
        run: npm run test:browser:nav -w @freva-org/portal-builder

      - name: Live announcements gate
        run: npm run test:browser:announcements -w @freva-org/portal-builder

      - name: Per-mode page palette gate (a white light page)
        run: npm run test:browser:paper -w @freva-org/portal-builder

      - name: Customisation fixtures gate (portal-style-v1, portal-template-v1, layout options)
        run: npm run test:browser:customisation -w @freva-org/portal-builder

      - name: Packaging gate
        run: npm run test:packaging -w @freva-org/portal-builder

      - name: Freva playground under its generated policy (needs a public package index)
        run: npm run test:browser:package-index -w @freva-org/portal-builder

      - name: Build the fictional consumers
        run: |
          node packages/portal-builder/bin/freva-portal-builder.mjs build \
            --source-root examples/minimal-portal \
            --config examples/minimal-portal/portal.yaml \
            --out build/minimal --quiet
          node packages/portal-builder/bin/freva-portal-builder.mjs verify --dir build/minimal
          node packages/portal-builder/bin/freva-portal-builder.mjs build \
            --source-root examples/full-portal \
            --config examples/full-portal/portal.yaml \
            --out build/full --quiet \
            --effective-at 2026-01-07T12:00:00Z \
            --stac-materials packages/stac-browser/materials
          node packages/portal-builder/bin/freva-portal-builder.mjs verify --dir build/full
        env:
          SOURCE_DATE_EPOCH: 1760000000

      - name: Source closure
        run: npm run closure

      - name: Licence report and SBOM
        run: |
          npm run licenses
          npm run sbom

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portal-builder-supply-chain
          path: packages/portal-builder/reports/

  # ---------------------------------------------------------------------------------------------
  # Security gates. They are jobs of THIS workflow on purpose: publish.yml releases only a commit
  # whose CI run succeeded (scripts/require-ci-success.mjs), so each blocking job below blocks a
  # release too, with no second workflow for the release check to know about. The one job that
  # only reports says so in its name.

  npm-audit:
    name: security / npm audit (high and above)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # The lockfile is the whole tree that ships and builds; nothing needs installing to audit it.
      - name: Audit the workspace lockfile
        run: npm audit --package-lock-only --audit-level=high

  # STAC Browser is built from upstream's own lockfile, verified by digest, so its tree cannot be
  # fixed here (packages/stac-browser/UPSTREAM.md). This keeps its findings visible in every run
  # without failing CI; a reviewed pin update is what clears them.
  stac-audit:
    name: security / STAC Browser lockfile audit (report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: packages/stac-browser/.nvmrc
      - name: Fetch the pinned upstream manifest and lockfile, verifying the lockfile digest
        run: |
          set -euo pipefail
          PIN=packages/stac-browser/upstream.json
          REPO=$(node -p "require('./$PIN').repository")
          COMMIT=$(node -p "require('./$PIN').commit")
          LOCK=$(node -p "require('./$PIN').lockfile")
          WANT=$(node -p "require('./$PIN').lockfileDigest")
          SRC="$RUNNER_TEMP/stac-src"
          OUT="$RUNNER_TEMP/stac-audit"
          git init -q "$SRC"
          git -C "$SRC" remote add origin "$REPO"
          git -C "$SRC" fetch -q --depth 1 origin "$COMMIT"
          mkdir -p "$OUT"
          git -C "$SRC" show "FETCH_HEAD:package.json" > "$OUT/package.json"
          git -C "$SRC" show "FETCH_HEAD:$LOCK" > "$OUT/package-lock.json"
          GOT="sha256:$(sha256sum "$OUT/package-lock.json" | cut -d' ' -f1)"
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::upstream lockfile is $GOT, the recipe records $WANT"
            exit 1
          fi
      - name: Audit it and report
        working-directory: ${{ runner.temp }}/stac-audit
        run: |
          status=0
          npm audit --package-lock-only --audit-level=high > audit.txt 2>&1 || status=$?
          {
            echo "### STAC Browser lockfile audit (report-only)"
            echo ""
            echo '```'
            tail -n 60 audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::warning::STAC Browser's pinned lockfile has high or critical advisories; see the job summary."
          fi

  dependency-review:
    name: security / dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Compares the dependency graph of the PR with its base; fails on a newly added dependency
      # with a high or critical advisory. Needs the repository's dependency graph switched on.
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  codeql:
    name: security / CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write # upload results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      # A finished analysis is not the same as no findings. What blocks a merge on findings is the
      # "Require code scanning results" rule on main (Settings -> Rules), at High or higher.
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"

  secrets:
    name: security / gitleaks (new commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # Through the Go toolchain, which verifies the module against sum.golang.org. (The
      # gitleaks action needs a licence key for organisation accounts; the CLI does not.)
      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      # Only what this run adds: the PR's commits, or the commits of this push. History is
      # covered by GitHub secret scanning, which scans the whole repository.
      #
      # gitleaks reads `git log -p`, which shows NO diff for a merge commit by default, so a
      # secret typed while resolving a conflict would pass unseen. --diff-merges=first-parent
      # shows each merge as what it changed on the branch it landed on.
      # (packages/browser-python/tests/secret-scan.test.ts checks this against a real merge.)
      - name: Scan the new commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          MERGES="--diff-merges=first-parent"
          case "$EVENT" in
            pull_request) opts="$MERGES $PR_BASE..HEAD" ;;
            push)
              if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
                opts="$MERGES $PUSH_BEFORE..HEAD"
              else
                opts="$MERGES HEAD~1..HEAD"
              fi
              ;;
            *) opts="$MERGES --full-history --all" ;; # workflow_dispatch: the whole history
          esac
          "$(go env GOPATH)/bin/gitleaks" git --no-banner --redact --log-opts="$opts" .

  workflow-lint:
    name: security / zizmor (workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Offline audits only, so the result depends on this commit and not on the API.
      - name: Audit the workflows
        run: pipx run zizmor==1.31.1 --offline --no-progress --min-severity medium .github/workflows

  container-scan:
    name: security / container image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # build.sh refuses to build without recorded base-image digests, and writing them by hand is
      # not allowed (container/portal-builder/README.md). Until the lock is committed this job
      # says so and passes; once it is, the image is built and must scan clean.
      - name: Are the base images pinned?
        id: lock
        run: |
          if [ -f container/portal-builder/base-images.lock ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::container/portal-builder/base-images.lock is not committed yet, so the canonical image cannot be built or scanned. Run container/portal-builder/resolve-base-digests.sh, review and commit the result."
          fi
      - name: Build the image
        if: steps.lock.outputs.present == 'true'
        run: bash container/portal-builder/build.sh ci-scan
      - name: Scan the image
        if: steps.lock.outputs.present == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/freva-org/portal-builder:ci-scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
