name: Check STAC Browser releases

on:
  schedule:
    - cron: "0 3 * * 5"
  workflow_dispatch: {}
  # Every change to the recipe - the bot's own bump PRs included - is built before it can merge.
  pull_request:
    paths:
      - "packages/stac-browser/upstream.json"
      - "packages/stac-browser/adapter-contract.json"
      - "packages/stac-browser/patches/**"
      - "packages/stac-browser/scripts/**"

permissions:
  contents: read

concurrency:
  group: stac-browser-${{ github.event_name == 'pull_request' && github.ref || 'reconcile' }}
  cancel-in-progress: true

jobs:
  candidate-check:
    name: stac-browser (build at the pin)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: packages/stac-browser/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build STAC Browser at the pinned release
        run: npm run stac:prepare -- --out "$RUNNER_TEMP/materials"

  # Runs upstream code, so it can't write.
  prepare:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.resolve.outputs.changed }}
      tag: ${{ steps.resolve.outputs.tag }}
      new: ${{ steps.resolve.outputs.new }}
      green: ${{ steps.build.outputs.green }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: packages/stac-browser/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # The recipe pins a stable release (tests/upstream-pin.test.mjs), so this follows
      # upstream's newest vX.Y.Z tag rather than main. Release candidates are skipped: `sort -V`
      # would otherwise put v5.1.0-rc.1 after v5.1.0. `^{}` peels an annotated tag to its commit.
      - name: Resolve current pin and upstream's newest release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_AGE_DAYS: 7
        run: |
          set -euo pipefail
          PIN=packages/stac-browser/upstream.json
          REPO=$(node -p "require('./$PIN').repository")
          OLD=$(node -p "require('./$PIN').commit")
          OLD_TAG=$(node -p "require('./$PIN').tag")
          TAG=$(git ls-remote --tags --refs "$REPO" 'v*' | sed 's#.*refs/tags/##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          NEW=$(git ls-remote "$REPO" "refs/tags/$TAG^{}" | cut -f1)
          [ -n "$NEW" ] || NEW=$(git ls-remote "$REPO" "refs/tags/$TAG" | cut -f1)
          {
            echo "repo=$REPO"
            echo "old=$OLD"
            echo "old_tag=$OLD_TAG"
            echo "new=$NEW"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          if [ "$OLD" = "$NEW" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already pinned to upstream's newest release $TAG ($NEW); nothing to do."
          else
            # A release must be MIN_AGE_DAYS old by GitHub's own published_at, as for Dependabot.
            SLUG=$(printf '%s' "$REPO" | sed -E 's#^https://github\.com/##; s#\.git$##')
            PUBLISHED=$(gh api "repos/$SLUG/releases/tags/$TAG" --jq .published_at 2>/dev/null || true)
            if [ -z "$PUBLISHED" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "::warning::$TAG has no GitHub release to date it; the pin stays at $OLD_TAG."
            elif [ $(( $(date +%s) - $(date -d "$PUBLISHED" +%s) )) -lt $(( MIN_AGE_DAYS * 86400 )) ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "$TAG was released $PUBLISHED; waiting until it is $MIN_AGE_DAYS days old."
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "Pin $OLD_TAG ($OLD) -> $TAG ($NEW), released $PUBLISHED"
            fi
          fi

      - name: Update the pin
        id: pin
        if: steps.resolve.outputs.changed == 'true'
        env:
          NEW_COMMIT: ${{ steps.resolve.outputs.new }}
          NEW_TAG: ${{ steps.resolve.outputs.tag }}
        run: >-
          node packages/stac-browser/scripts/pin.mjs
          --commit "$NEW_COMMIT"
          --tag "$NEW_TAG"

      - name: Try to build at the new upstream release
        id: build
        if: steps.resolve.outputs.changed == 'true'
        run: |
          set -o pipefail
          if npm run stac:prepare -- --out "$RUNNER_TEMP/materials" 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            node packages/stac-browser/scripts/pin.mjs --materials "$RUNNER_TEMP/materials"
            echo "green=true" >> "$GITHUB_OUTPUT"
          else
            echo "green=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the PR body
        id: body
        if: steps.resolve.outputs.changed == 'true'
        env:
          OLD: ${{ steps.resolve.outputs.old }}
          NEW: ${{ steps.resolve.outputs.new }}
          OLD_TAG: ${{ steps.resolve.outputs.old_tag }}
          TAG: ${{ steps.resolve.outputs.tag }}
          REPO: ${{ steps.resolve.outputs.repo }}
          GREEN: ${{ steps.build.outputs.green }}
          LOCKFILE: ${{ steps.pin.outputs.lockfile }}
          LICENCE: ${{ steps.pin.outputs.licence }}
        run: |
          SCB="$RUNNER_TEMP/stac-browser"
          # History only, no file contents: enough for the commit list and the changed paths.
          git init -q "$SCB"
          git -C "$SCB" remote add origin "$REPO"
          git -C "$SCB" fetch -q --filter=blob:none origin "$NEW" 2>/dev/null || true
          git -C "$SCB" fetch -q --filter=blob:none origin "$OLD" 2>/dev/null || true
          # The files our patches touch, from the recipe, plus the two upstream documents the
          # adapter contract was reviewed against.
          WATCHED=$(node -p "[...new Set([...require('./packages/stac-browser/upstream.json').patches.series.flatMap((p) => p.files), 'docs/options.md', 'config.schema.json'])].join('\n')")
          {
            short() { git -C "$SCB" rev-parse --short "$1" 2>/dev/null || echo "${1:0:7}"; }
            SHORT_NEW=$(short "$NEW"); SHORT_OLD=$(short "$OLD")
            SUBJECT=$(git -C "$SCB" log -1 --format='%s' "$NEW" 2>/dev/null || echo "$TAG")
            echo "Bumps the pinned [STAC Browser](https://github.com/radiantearth/stac-browser) release that \`npm run stac:prepare\` builds."
            echo ""
            echo "**Upstream bump:** \`$OLD_TAG\` (\`$SHORT_OLD\`) to \`$TAG\` (\`$SHORT_NEW\`)"
            echo ""
            if git -C "$SCB" rev-parse -q --verify "$OLD^{commit}" >/dev/null 2>&1; then
              N=$(git -C "$SCB" log --no-merges --oneline "$OLD..$NEW" | wc -l | tr -d ' ')
              echo "**$N upstream commit(s):**"
              echo ""
              # --max-count, not `| head`: under the runner's pipefail, head closing the pipe
              # early kills the step with SIGPIPE once there are more than 50 commits.
              git -C "$SCB" log --no-merges --date=short --max-count=50 \
                --pretty='- `%h` %s _(%cd)_' "$OLD..$NEW"
              if [ "$N" -gt 50 ]; then echo "- _… and $((N - 50)) more_"; fi
              echo ""
              # Flag changes to files our patches / adapter contract depend on.
              HITS=$(git -C "$SCB" diff --name-only "$OLD..$NEW" | grep -Fx -f <(echo "$WATCHED") || true)
              if [ -n "$HITS" ]; then
                echo "> ⚠️ **Touches files our patches depend on:**"
                echo "$HITS" | sed 's/^/> - `/; s/$/`/'
                echo ">"
                if [ "$GREEN" = "true" ]; then
                  echo "> IMPORTANT: The build passed, so the patches still applied"
                else
                  echo "> IMPORTANT: Start here, the build did not pass"
                fi
              else
                echo "_None of the patched files changed in this range._"
              fi
            else
              echo "_Previous pin \`$OLD\` isn't reachable in upstream history (force-push?); commit list unavailable._"
            fi
            echo ""
            if [ "$LOCKFILE" = "changed" ]; then
              echo "📦 Upstream's \`package-lock.json\` changed; the new digest is recorded in \`upstream.json\`."
              echo ""
            fi
            if [ "$LICENCE" = "changed" ]; then
              echo "⚖️ **Upstream's LICENSE changed.** The recipe keeps the reviewed digest, so preparation refuses until someone has read it."
              echo ""
            fi
            if [ "$GREEN" = "true" ]; then
              echo "---"
              echo "🕊️ \`npm run stac:prepare\` built cleanly at the new release; this lands once CI is green."
            else
              echo "---"
              echo "### 🫤🥊 Build failed at the new upstream release"
              echo ""
              echo "\`main\` still pins the last green release (\`$OLD_TAG\`, \`$SHORT_OLD\`). This **draft** PR pins the new one so a maintainer can fix it forward"
              echo ""
              echo "<details><summary>Last lines of the build log</summary>"
              echo ""
              echo '```'
              tail -n 60 "$RUNNER_TEMP/build.log"
              echo '```'
              echo ""
              echo "</details>"
            fi
          } > "$RUNNER_TEMP/pr-body.md"
          echo "path=$RUNNER_TEMP/pr-body.md" >> "$GITHUB_OUTPUT"
          echo "short_new=$SHORT_NEW" >> "$GITHUB_OUTPUT"
          echo "subject=$SUBJECT" >> "$GITHUB_OUTPUT"
          echo "count=${N:-?}" >> "$GITHUB_OUTPUT"

      - name: Stage the pin update for the PR job
        if: steps.resolve.outputs.changed == 'true'
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/pin-proposal"
          rm -rf "$OUT"
          mkdir "$OUT"
          cp packages/stac-browser/upstream.json packages/stac-browser/adapter-contract.json "$OUT/"
          cp "$RUNNER_TEMP/pr-body.md" "$OUT/pr-body.md"

      - name: Upload the pin update
        if: steps.resolve.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stac-browser-pin
          path: ${{ runner.temp }}/pin-proposal
          retention-days: 1

  # Can write, so it runs no upstream code and copies nothing from `prepare`.
  open-pr:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: packages/stac-browser/.nvmrc

      - name: Download the pin update
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: stac-browser-pin
          path: ${{ runner.temp }}/pin-proposal

      - name: Rebuild the pin update from the proposal
        id: proposal
        env:
          REPORTED_COMMIT: ${{ needs.prepare.outputs.new }}
          REPORTED_TAG: ${{ needs.prepare.outputs.tag }}
        run: >-
          node packages/stac-browser/scripts/accept-pin-update.mjs "$RUNNER_TEMP/pin-proposal"
          --commit "$REPORTED_COMMIT" --tag "$REPORTED_TAG"
          --body-out "$RUNNER_TEMP/pr-body.md"

      # A PR opened with GITHUB_TOKEN triggers no workflows, so its checks never run and
      # auto-merge never fires. The app token is what makes the green path land on its own.
      - name: Create freva-bot app token
        id: app-token
        if: ${{ vars.FREVA_BOT_APP_ID != '' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.FREVA_BOT_APP_ID }}
          private-key: ${{ secrets.FREVA_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open / update green PR
        id: green-pr
        if: needs.prepare.outputs.green == 'true'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          add-paths: |
            packages/stac-browser/upstream.json
            packages/stac-browser/adapter-contract.json
            packages/stac-browser/THIRD_PARTY_NOTICES.md
            README.md
          branch: bump-stac-browser/${{ steps.proposal.outputs.commit }}
          delete-branch: true
          base: main
          commit-message: "stac-browser: bump pin to ${{ steps.proposal.outputs.tag }} (${{ steps.proposal.outputs.commit }})"
          committer: "freva-bot <freva-bot@users.noreply.github.com>"
          author: "freva-bot <freva-bot@users.noreply.github.com>"
          title: "⬆️ Bump STAC Browser to ${{ steps.proposal.outputs.tag }} (${{ steps.proposal.outputs.short }})"
          body-path: ${{ runner.temp }}/pr-body.md
          reviewers: "tropicrainforest"
          labels: |
            stac-browser

      - name: Enable auto-merge on the green PR
        if: steps.green-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.green-pr.outputs.pull-request-number }}
        run: |
          gh pr merge --auto --squash "$PR_NUMBER" || \
            echo "::warning::could not enable auto-merge (check branch protection / repo settings)"

      - name: Open / update red draft PR
        id: red-pr
        if: needs.prepare.outputs.green != 'true'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          add-paths: |
            packages/stac-browser/upstream.json
            packages/stac-browser/adapter-contract.json
            packages/stac-browser/THIRD_PARTY_NOTICES.md
            README.md
          branch: stac-browser-candidate/${{ steps.proposal.outputs.commit }}
          delete-branch: false
          base: main
          draft: true
          commit-message: "stac-browser: candidate pin ${{ steps.proposal.outputs.tag }} (build red)"
          committer: "freva-bot <freva-bot@users.noreply.github.com>"
          author: "freva-bot <freva-bot@users.noreply.github.com>"
          title: "🚨 STAC Browser Build failed: Can't bump to ${{ steps.proposal.outputs.tag }} (${{ steps.proposal.outputs.short }})"
          body-path: ${{ runner.temp }}/pr-body.md
          reviewers: "tropicrainforest"
          labels: |
            stac-browser
