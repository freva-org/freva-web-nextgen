name: Publish

on:
  push:
    branches: [main]

# Two pushes must not race each other into the registry.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    name: version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # OIDC token for npm trusted publishing

    steps:
      - uses: actions/checkout@v4
      - name: Create freva-bot app token
        id: app-token
        if: ${{ vars.FREVA_BOT_APP_ID != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.FREVA_BOT_APP_ID }}
          private-key: ${{ secrets.FREVA_BOT_PRIVATE_KEY }}

      - name: Pick token
        id: tok
        run: |
          if [ -n "${{ steps.app-token.outputs.token }}" ]; then
            echo "Acting as freva-bot."
            echo "token=${{ steps.app-token.outputs.token }}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::freva-bot unavailable; acting as github-actions[bot]." \
                 "The version PR it opens will not trigger CI."
            echo "token=${{ secrets.GITHUB_TOKEN }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # registry-url is required
      - name: Clear the empty auth token setup-node writes
        run: sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"

      # Trusted publishing needs npm >= 11.5.1. NOT `npm@latest`: npm 12 returns
      # `npm info --json` as an array, which changesets misreads as "unpublished".
      - name: Pin npm
        run: npm install -g npm@11.19.0

      - name: Install dependencies
        run: npm ci

      # ts-oidc-auth-client's prepublishOnly runs its strict three-engine gate.
      - name: Install Playwright engines
        run: npm exec -- playwright install --with-deps chromium firefox webkit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Changesets present -> open/refresh the "Version Packages" PR, publish
      # nothing. Changesets consumed -> that PR was just merged, so the publish
      # step below runs. An ordinary feature merge can only move the release PR
      # forward; CI's `changeset-required` job refuses a hand-bumped version.
      - name: Version
        id: changesets
        uses: changesets/action@v1
        with:
          version: npx changeset version
          title: "chore: version packages"
          commit: "chore: version packages"
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ steps.tok.outputs.token }}

      - name: Publish
        id: publish
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: node scripts/publish-packages.mjs

      - name: Tag published versions
        if: steps.publish.outputs.published != '' && steps.publish.outputs.published != '[]'
        env:
          GH_TOKEN: ${{ steps.tok.outputs.token }}
        run: |
          git config user.name "freva-bot"
          git config user.email "freva-bot@users.noreply.github.com"
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for tag in $(echo '${{ steps.publish.outputs.published }}' | jq -r '.[]'); do
            git tag -f "$tag"
            git push -f origin "$tag"
          done
