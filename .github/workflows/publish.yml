name: Publish

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Mints the OIDC token npm exchanges for publish rights.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # @freva-org/ts-oidc-auth-client's prepublishOnly runs its strict browser
      # gate, which requires all three engines to be present before publish.
      - name: Install Playwright engines
        run: npm exec -- playwright install --with-deps chromium firefox webkit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Creates a "Version Packages" PR when changesets are present.
      # Merging that PR triggers the actual npm publish below.
      - name: Create version PR or publish
        uses: changesets/action@v1
        with:
          publish: npx changeset publish --provenance
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
