name: Release

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- gated by require-ci-success.mjs
    workflows: [CI]
    types: [completed]
    branches: [main]

  workflow_dispatch:

# Two runs must not race each other into the registry.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    name: version or publish
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      actions: read
      contents: write
      pull-requests: write
      id-token: write # OIDC token for npm trusted publishing

    steps:
      # `main`, not the verified SHA: changesets pushes a version commit and opens a PR, and it
      # needs a branch to do that on. The check below is what keeps the two honest.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0

      - name: Require a successful CI run for this exact commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_RUN_JSON: ${{ toJSON(github.event.workflow_run) }}
        run: |
          VERIFY_SHA="$(git rev-parse HEAD)" node scripts/require-ci-success.mjs

      - name: Create freva-bot app token
        id: app-token
        if: ${{ vars.FREVA_BOT_APP_ID != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.FREVA_BOT_APP_ID }}
          private-key: ${{ secrets.FREVA_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Pick token
        id: tok
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          DEFAULT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            echo "Acting as freva-bot."
            echo "token=$APP_TOKEN" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::freva-bot unavailable; acting as github-actions[bot]." \
                 "The version PR it opens will not trigger CI."
            echo "token=$DEFAULT_TOKEN" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # registry-url is required
      - name: Clear the empty auth token setup-node writes
        run: sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"

      # Trusted publishing needs npm >= 11.5.1. NOT `npm@latest`: npm 12 returns
      # `npm info --json` as an array, which changesets misreads as "unpublished".
      - name: Pin npm
        run: npm install -g npm@11.19.0

      - name: Install dependencies
        run: npm ci

      # Changesets present -> open/refresh the "Version Packages" PR, publish
      # nothing. Changesets consumed -> that PR was just merged, so the publish
      # step below runs. An ordinary feature merge can only move the release PR
      # forward; CI's `changeset-required` job refuses a hand-bumped version.
      - name: Version
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        # v2 takes the token as an input only: a GITHUB_TOKEN env that differs is refused.
        with:
          github-token: ${{ steps.tok.outputs.token }}
          version-script: npx changeset version
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"

      # Only the publish path needs a build, and every other push to main stops at
      # the version PR. ts-oidc-auth-client's prepublishOnly runs its strict
      # three-engine gate, so the engines come with it.
      - name: Install Playwright engines
        if: steps.changesets.outputs.has-changesets == 'false'
        run: npm exec -- playwright install --with-deps chromium firefox webkit

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.changesets.outputs.has-changesets == 'false'
        with:
          python-version: "3.12"

      - name: Install the pinned RST helper
        if: steps.changesets.outputs.has-changesets == 'false'
        run: pip install ./tools/portal-rst-renderer

      - name: Build
        if: steps.changesets.outputs.has-changesets == 'false'
        run: npm run build

      # portal-builder's notebook tests plan sites from these prebuilt extensions.
      - name: Build the notebook extensions
        if: steps.changesets.outputs.has-changesets == 'false'
        run: npm run build:labextensions

      - name: Test
        if: steps.changesets.outputs.has-changesets == 'false'
        run: npm test

      - name: Packaged package
        if: steps.changesets.outputs.has-changesets == 'false'
        run: npm run test:packaging -w @freva-org/browser-python

      - name: Bundle size
        if: steps.changesets.outputs.has-changesets == 'false'
        run: npm run check:bytes -w @freva-org/browser-python

      - name: Publish
        id: publish
        if: steps.changesets.outputs.has-changesets == 'false'
        run: node scripts/publish-packages.mjs

      # `tags` covers versions found already on the registry too, so a re-run of a
      # partial release tags what the first attempt published. A tag marks the
      # commit that released its version, so an existing one keeps its target.
      - name: Tag published versions
        if: steps.publish.outputs.tags != '' && steps.publish.outputs.tags != '[]'
        env:
          GH_TOKEN: ${{ steps.tok.outputs.token }}
          TAGS: ${{ steps.publish.outputs.tags }}
        run: |
          git config user.name "freva-bot"
          git config user.email "freva-bot@users.noreply.github.com"
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          existing=$(git ls-remote --tags origin | sed 's#.*refs/tags/##; s#\^{}$##' | sort -u)
          for tag in $(printf '%s' "$TAGS" | jq -r '.[]'); do
            if printf '%s\n' "$existing" | grep -qxF "$tag"; then
              echo "$tag is already tagged."
              continue
            fi
            git tag "$tag"
            git push origin "$tag"
          done
