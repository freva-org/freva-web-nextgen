[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freva-portal-rst"
version = "1.0.0"
description = "The exact RST helper for the portal-content-v1 rendering profile. It emits the closed PortalDocumentIR and nothing else."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
dependencies = ["docutils==0.23"]

[project.scripts]
freva-portal-rst = "freva_portal_rst.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
